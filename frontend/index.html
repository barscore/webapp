<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#E07B1A" />

    <!-- Apply the saved theme before first paint to avoid a flash of the
         default palette, and request ONLY the active theme's two font families
         (loading all 9 in one stylesheet cost a blocking CSS round-trip for
         fonts the user never sees). Kept in sync with src/hooks/useTheme.js,
         which swaps the same #rabar-fonts link on theme change. -->
    <script>
      try {
        var t = localStorage.getItem('rabar-theme');
        var themeColors = {
          'midnight-red': '#C94060',
          'gold-rush': '#FFB800',
          'electric-blue': '#5B8CFF',
          aperitif: '#D6452C',
          mar7yyy: '#DC8665',
        };
        if (themeColors[t]) {
          document.documentElement.dataset.theme = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', themeColors[t]);
        }
      } catch (e) {}
      // Graphics quality — applied before paint so low-end devices never render
      // the heavy visuals first. Default "simple" (anything but "rich").
      try {
        var g = localStorage.getItem('rabar-graphics');
        document.documentElement.dataset.graphics = g === 'rich' ? 'rich' : 'simple';
      } catch (e) {}
      var themeFonts = {
        rabar: 'family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700',
        'midnight-red': 'family=Space+Grotesk:wght@600;700&family=Source+Sans+3:wght@400;600;700',
        'gold-rush': 'family=Barlow+Condensed:wght@700;900&family=DM+Sans:wght@400;500;700',
        'electric-blue': 'family=Unbounded:wght@600;700&family=Karla:wght@400;500;700',
        aperitif: 'family=Archivo:wght@400;700;800&family=Instrument+Sans:wght@400;500;600;700',
        mar7yyy: 'family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700',
      };
      var fontLink = document.createElement('link');
      fontLink.rel = 'stylesheet';
      fontLink.id = 'rabar-fonts';
      fontLink.href =
        'https://fonts.googleapis.com/css2?' +
        (themeFonts[t] || themeFonts.rabar) +
        '&display=swap';
      document.head.appendChild(fontLink);
    </script>

    <!-- Primary SEO -->
    <title>rabar — mappa dei bar valutati dalla community</title>
    <meta
      name="description"
      content="rabar è la mappa interattiva dei bar valutati dalla community su prezzo, qualità dell'alcol e socialità. Trova il bar giusto vicino a te."
    />
    <meta
      name="keywords"
      content="bar, mappa bar, migliori bar, valutazioni bar, prezzo bar, cocktail, aperitivo, locali, nightlife, rabar"
    />
    <meta name="author" content="rabar" />
    <meta name="robots" content="index, follow" />
    <!-- Set to your production URL before deploy. -->
    <link rel="canonical" href="https://rabar.it/" />

    <!-- Open Graph (Facebook, WhatsApp, Telegram…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="rabar" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="rabar — mappa dei bar valutati dalla community" />
    <meta
      property="og:description"
      content="Trova il bar giusto: prezzo, qualità dell'alcol e socialità valutati dalla community, su una mappa interattiva."
    />
    <meta property="og:url" content="https://rabar.it/" />
    <meta property="og:image" content="https://rabar.it/icons/icon-512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="rabar — mappa dei bar valutati dalla community" />
    <meta
      name="twitter:description"
      content="Trova il bar giusto: prezzo, qualità dell'alcol e socialità valutati dalla community."
    />
    <meta name="twitter:image" content="https://rabar.it/icons/icon-512.png" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <!-- Theme type systems: rabar = Syne + DM Sans · midnight-red = Space
         Grotesk + Source Sans 3 · gold-rush = Barlow Condensed + DM Sans ·
         electric-blue = Unbounded + Karla · aperitif = Archivo + Instrument
         Sans · mar7yyy = Playfair Display + Inter. The stylesheet link (#rabar-fonts) is injected by the theme
         bootstrap script above with only the active theme's families. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Warm up the OSM tile server so the first tiles start downloading
         without a fresh DNS+TLS round-trip. -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" />

    <!-- Structured data: helps search engines understand the app. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "rabar",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web",
        "description": "Mappa interattiva dei bar valutati dalla community su prezzo, qualità dell'alcol e socialità.",
        "url": "https://rabar.it/",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>

    <!-- Google AdSense (Auto Ads) is injected at runtime by services/adsense.js,
         only when VITE_ADSENSE_CLIENT_ID is set AND the user granted consent
         (prior-blocking, see services/consent.js). Nothing to configure here —
         leave the env var empty to disable ads. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
